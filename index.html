<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="aset/YPKLOGO.png" />
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main><div class="wrap" id="app"></div></main>
    <script src="app.js"></script>
    <script>
      shell(null, [
        ["Home", "#home", "home"],
        ["Materi", "#materi", "materi"],
        ["Quiz", "#quiz", "quiz"],
      ]);
      const app = document.getElementById("app");
      let D, run;
      let lastListPage = "#home";
      function setNav(k) {
        document
          .querySelectorAll("nav a")
          .forEach((a) =>
            a.classList.toggle("on", a.getAttribute("href") === "#" + k),
          );
      }
      function route() {
        D = Store.get();
        const currentHash = location.hash || "#home";
        const [k = "home", id] = currentHash.slice(1).split("/");
        const page = k || "home";
        if (!id) {
          lastListPage = currentHash;
        }
        setNav(page);
        scrollTo(0, 0);
        (({ home, materi, quiz })[page] || home)(id);
      }
      function goBack() {
        location.hash = lastListPage || "#home";
      }
      function wrapMain() {
        const m = document.querySelector("main");
        m.style.padding = "";
        m.innerHTML = '<div class="wrap" id="app"></div>';
        return document.getElementById("app");
      }
      function cards(l, t) {
        if (!l.length)
          return `<div class="empty">${t === "m" ? "Tidak ada materi" : "Tidak ada kuis"}</div>`;
        return `<div class="grid">${l
          .map((x) => {
            if (t === "m") {
              const preview = x.ringkasan || cuplikan(x.isi) || "Klik untuk membaca materi selengkapnya.";
              return `<div class="card clickable" onclick="location.hash='#materi/${x.id}'"><h3>${esc(x.judul)}</h3><p>${esc(preview)}</p></div>`;
            }
            return `<div class="card clickable" onclick="${x.tipe === "native" ? `location.hash='#quiz/${x.id}'` : `window.open('${esc(x.link)}','_blank')`}"><span class="tag q">${TIPE[x.tipe] || "Link eksternal"}</span><h3>${esc(x.judul)}</h3><p>${esc(x.deskripsi)}</p><span class="btn sm" style="align-self:flex-start;pointer-events:none">${x.tipe === "native" ? `Kerjakan (${x.soal.length} soal) →` : `Buka kuis ↗`}</span></div>`;
          })
          .join("")}</div>`;
      }
      function materi(id) {
        const a = wrapMain();
        const m = D.materi.find((x) => x.id === id);
        if (m) {
          const idx = D.materi.findIndex((x) => x.id === id);
          const prev = idx > 0 ? D.materi[idx - 1] : null;
          const next = idx >= 0 && idx < D.materi.length - 1 ? D.materi[idx + 1] : null;

          const textOnly = (new DOMParser().parseFromString(m.isi || "", "text/html").body.textContent || "").trim();
          const wordCount = textOnly ? textOnly.split(/\s+/).length : 0;
          const menitBaca = Math.max(1, Math.ceil(wordCount / 180));

          const relatedQuiz = D.quiz.find((q) => q.tipe === "native");
          const legacyVid = (m.video && !(m.isi || "").includes(m.video)) ? yt(m.video) : "";

          a.innerHTML = `<div class="content-wrapper">
            <div class="read-topbar">
              <a class="back" href="javascript:void(0)" onclick="goBack()">← Kembali</a>
            </div>
            <article class="read">
              <div class="read-header">
                <h1>${esc(m.judul)}</h1>
                <div class="read-meta">
                  <span>⏱ ${menitBaca} menit baca</span>
                </div>
              </div>
              ${legacyVid}
              <div class="read-body">
                ${fmt(m.isi)}
              </div>
              <div class="read-footer">
                <div class="read-nav">
                  ${prev ? `<a class="read-nav-btn prev" href="#materi/${prev.id}"><span class="nav-label">← Sebelumnya</span><span class="nav-title">${esc(prev.judul)}</span></a>` : `<div></div>`}
                  ${next ? `<a class="read-nav-btn next" href="#materi/${next.id}"><span class="nav-label">Selanjutnya →</span><span class="nav-title">${esc(next.judul)}</span></a>` : `<div></div>`}
                </div>
                ${relatedQuiz ? `
                  <div class="quiz-cta">
                    <div class="quiz-cta-text">
                      <b>Uji Pemahaman Materi</b>
                      <p>Selesaikan kuis latihan untuk mengasah pemahamanmu terkait topik ini.</p>
                    </div>
                    <a class="btn" href="#quiz/${relatedQuiz.id}">Mulai Kuis →</a>
                  </div>
                ` : ""}
              </div>
            </article>
          </div>`;
          return;
        }
        a.innerHTML = `<h2>Materi</h2><p class="sub">Pilih topik yang ingin kamu pelajari.</p>${cards(D.materi, "m")}`;
      }
      function quiz(id) {
        const a = wrapMain();
        const q = D.quiz.find((x) => x.id === id && x.tipe === "native");
        if (!q) {
          a.innerHTML = `<h2>Quiz</h2><p class="sub">Uji pemahaman dan asah kemampuan fisikamu lewat latihan kuis interaktif.</p>${cards(D.quiz, "q")}`;
          return;
        }
        run = { q, i: 0, ans: [], lock: false };
        step();
      }
      function step() {
        const a = document.getElementById("app"),
          { q, i } = run;
        if (i >= q.soal.length) {
          const s = run.ans.filter((v, k) => v === q.soal[k].a).length;
          a.innerHTML = `<div class="content-wrapper"><div class="qbox"><h2>${esc(q.judul)} selesai</h2><div class="score">${Math.round((s / q.soal.length) * 100)}</div><p class="sub">Benar ${s} dari ${q.soal.length} soal.</p><div class="row"><button class="btn" onclick="quiz('${q.id}')">Ulangi</button><a class="btn ghost" href="#quiz">Kuis lain</a></div></div></div>`;
          return;
        }
        const s = q.soal[i];
        a.innerHTML = `<div class="content-wrapper"><a class="back" href="#quiz">← Semua kuis</a><div class="qbox"><div class="bar"><i style="width:${(i / q.soal.length) * 100}%"></i></div><p class="sub">Soal ${i + 1} dari ${q.soal.length}</p><h3>${esc(s.q)}</h3>${s.o.map((o, k) => `<button class="opt" data-k="${k}">${"ABCD"[k]}. ${esc(o)}</button>`).join("")}<div id="fb"></div></div></div>`;
        a.querySelectorAll(".opt").forEach(
          (b) =>
            (b.onclick = () => {
              if (run.lock) return;
              run.lock = true;
              const k = +b.dataset.k;
              run.ans[i] = k;
              a.querySelectorAll(".opt").forEach((x, j) => {
                x.disabled = true;
                if (j === s.a) x.classList.add("ok");
              });
              if (k !== s.a) b.classList.add("bad");
              document.getElementById("fb").innerHTML =
                `${s.e ? `<div class="exp"><b>${k === s.a ? "Benar." : "Kurang tepat."}</b> ${esc(s.e)}</div>` : ""}<button class="btn" style="margin-top:16px" id="nx">${i + 1 < q.soal.length ? "Soal berikutnya" : "Lihat hasil"}</button>`;
              document.getElementById("nx").onclick = () => {
                run.i++;
                run.lock = false;
                step();
              };
            }),
        );
      }
      /* home() menulis ulang <main>; pastikan struktur utama kembali ke normal */
      function home() {
        const m = document.querySelector("main");
        m.style.padding = "0";
        m.innerHTML = `<section class="hero"><div class="wrap"><h1>${esc(D.site.tagline)}</h1><p>${esc(D.site.deskripsi)}</p><a class="btn" href="#materi">Mulai belajar</a></div></section><div class="wrap" style="padding:40px 20px"><h2 style="margin-bottom:20px">Materi terbaru</h2>${cards(D.materi.slice(-3).reverse(), "m")}</div>`;
      }
      addEventListener("hashchange", route);
      route();
      footer();
    </script>
  </body>
</html>
