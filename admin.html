<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="YPKLOGO.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <img class="sidebar-logo" src="YPKLOGO.png" alt="Logo">
          <span class="sidebar-title">Panel Guru</span>
        </div>
        <nav class="sidebar-nav" id="sidenav"></nav>
        <a class="sidebar-back" href="index.html">← Kembali ke website</a>
      </aside>
      <div class="admin-main">
        <div class="admin-topbar" id="topbar"></div>
        <div class="admin-content" id="app"></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="app.js"></script>
    <script>
      const ICON_PLUS = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-1px;margin-right:5px"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`;
      let D = Store.get(),
        tab = "materi",
        edit = null;
      const $ = (s) => document.querySelector(s);
      const toast = (m) => {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("on");
        setTimeout(() => t.classList.remove("on"), 1800);
      };
      const save = () => {
        Store.save(D);
        toast("Tersimpan");
      };
      const TABS = [
        ["materi", "📚", "Materi"],
        ["quiz", "✏️", "Quiz"],
        ["absen", "📋", "Presensi"],
        ["siswa", "👥", "Data Siswa"],
        ["site", "⚙️", "Pengaturan"],
      ];
      function draw() {
        $("#sidenav").innerHTML = TABS.map(
          (t) =>
            `<button class="sidebar-item${tab === t[0] ? " active" : ""}" onclick="tab='${t[0]}';edit=null;curMasterKls=null;editMaster=false;draw()"><span class="sidebar-icon">${t[1]}</span>${t[2]}</button>`,
        ).join("");
        const curTab = TABS.find((t) => t[0] === tab);
        $("#topbar").innerHTML = `<h2>${curTab ? curTab[2] : "Admin"}</h2>`;
        $("#app").innerHTML = {
          materi: pMateri,
          quiz: pQuiz,
          absen: pAbsen,
          siswa: pSiswa,
          site: pSite,
          data: pData,
        }[tab]();
      }
      function list(arr, type, sub) {
        return `<div class="panel"><div class="row" style="justify-content:space-between"><b>Daftar (${arr.length})</b><button class="btn sm" onclick="edit='new';draw()">${ICON_PLUS}Tambah</button></div>${arr.map((x, idx) => `<div class="item"><div style="display:flex;align-items:flex-start;gap:12px"><span style="font-size:15px;color:var(--text-muted);font-weight:700;min-width:24px;line-height:1.4">${idx + 1}.</span><div><b>${esc(x.judul)}</b><div class="hint">${esc(sub(x))}</div></div></div><div class="row"><button class="btn sm ghost" onclick="edit='${x.id}';draw()">Ubah</button><button class="btn sm del" onclick="del('${type}','${x.id}')">Hapus</button></div></div>`).join("") || '<div class="empty">Belum ada data.</div>'}</div>`;
      }
      function del(t, id) {
        if (confirm("Hapus item ini?")) {
          D[t] = D[t].filter((x) => x.id !== id);
          save();
          draw();
        }
      }
      function pMateri() {
        if (!edit) return list(D.materi, "materi", (x) => x.kategori);
        const m = D.materi.find((x) => x.id === edit) || {
          judul: "",
          kategori: "",
          ringkasan: "",
          video: "",
          isi: "",
        };
        return `<div class="panel"><b>${m.id ? "Ubah" : "Tambah"} materi</b>
 <label>Judul</label><input id="j" value="${esc(m.judul)}"><label>Kategori / bab</label><input id="k" value="${esc(m.kategori)}" placeholder="Contoh: Kinematika">
 <label>Ringkasan singkat</label><input id="r" value="${esc(m.ringkasan)}"><label>Link video YouTube (opsional)</label><input id="v" value="${esc(m.video)}">
 <label>Isi materi</label><textarea id="i" style="min-height:260px">${esc(m.isi)}</textarea>
 <div class="hint">Format: awali baris dengan <code>## </code> untuk subjudul. Apit rumus dengan tiga tanda kutip terbalik (\`\`\`). Pisahkan paragraf dengan baris kosong.</div>
 <div class="row" style="margin-top:18px"><button class="btn" onclick="sM('${m.id || ""}')">Simpan</button><button class="btn ghost" onclick="edit=null;draw()">Batal</button></div></div>`;
      }
      function sM(id) {
        const o = {
          id: id || Store.uid("m"),
          judul: $("#j").value.trim(),
          kategori: $("#k").value.trim() || "Umum",
          ringkasan: $("#r").value.trim(),
          video: $("#v").value.trim(),
          isi: $("#i").value,
        };
        if (!o.judul) return toast("Judul wajib diisi");
        up(D.materi, o);
        edit = null;
        save();
        draw();
      }
      function up(a, o) {
        const i = a.findIndex((x) => x.id === o.id);
        i < 0 ? a.push(o) : (a[i] = o);
      }
      let Q;
      function pQuiz() {
        if (!edit)
          return list(
            D.quiz,
            "quiz",
            (x) =>
              (TIPE[x.tipe] || "Link eksternal") +
              (x.tipe === "native" ? ` · ${x.soal.length} soal` : ""),
          );
        if (!Q || Q._for !== edit) {
          Q = structuredClone(
            D.quiz.find((x) => x.id === edit) || {
              judul: "",
              tipe: "native",
              link: "",
              deskripsi: "",
              soal: [],
            },
          );
          Q._for = edit;
        }
        return `<div class="panel"><b>${Q.id ? "Ubah" : "Tambah"} quiz</b>
 <label>Judul</label><input id="j" value="${esc(Q.judul)}"><label>Deskripsi</label><input id="d" value="${esc(Q.deskripsi)}">
 <label>Jenis quiz</label><select id="t" onchange="sync();draw()">${Object.entries(
   TIPE,
 )
   .map(
     ([k, v]) =>
       `<option value="${k}" ${Q.tipe === k ? "selected" : ""}>${v}</option>`,
   )
   .join("")}</select>
 ${
   Q.tipe === "native"
     ? `<label>Soal pilihan ganda</label>${Q.soal
         .map(
           (
             s,
             n,
           ) => `<div class="soal"><div class="row" style="justify-content:space-between"><b>Soal ${n + 1}</b><button class="btn sm del" onclick="sync();Q.soal.splice(${n},1);draw()">Hapus</button></div>
  <label>Pertanyaan</label><input data-n="${n}" data-f="q" value="${esc(s.q)}">${s.o.map((o, k) => `<label>Pilihan ${"ABCD"[k]}</label><input data-n="${n}" data-f="o${k}" value="${esc(o)}">`).join("")}
  <label>Jawaban benar</label><select data-n="${n}" data-f="a">${"ABCD"
    .split("")
    .map(
      (c, k) =>
        `<option value="${k}" ${s.a === k ? "selected" : ""}>${c}</option>`,
    )
    .join("")}</select>
  <label>Pembahasan (opsional)</label><input data-n="${n}" data-f="e" value="${esc(s.e || "")}"></div>`,
         )
         .join("")}
  <button class="btn sm ghost" style="margin-top:14px" onclick="sync();Q.soal.push({q:'',o:['','','',''],a:0,e:''});draw()">Tambah soal</button>`
     : `<label>Link kuis</label><input id="l" value="${esc(Q.link)}" placeholder="https://"><div class="hint">Siswa akan membuka link ini di tab baru (bisa berupa Google Form, Quizizz, dll).</div>`
 }
 <div class="row" style="margin-top:18px"><button class="btn" onclick="sQ()">Simpan</button><button class="btn ghost" onclick="edit=null;Q=null;draw()">Batal</button></div></div>`;
      }
      function sync() {
        Q.judul = $("#j").value;
        Q.deskripsi = $("#d").value;
        Q.tipe = $("#t").value;
        if ($("#l")) Q.link = $("#l").value;
        document.querySelectorAll("[data-n]").forEach((e) => {
          const s = Q.soal[+e.dataset.n],
            f = e.dataset.f;
          f[0] === "o"
            ? (s.o[+f[1]] = e.value)
            : f === "a"
              ? (s.a = +e.value)
              : (s[f] = e.value);
        });
      }
      function sQ() {
        sync();
        if (!Q.judul.trim()) return toast("Judul wajib diisi");
        if (Q.tipe !== "native" && !/^https?:\/\//.test(Q.link))
          return toast("Link harus diawali https://");
        if (
          Q.tipe === "native" &&
          (!Q.soal.length ||
            Q.soal.some((s) => !s.q.trim() || s.o.some((o) => !o.trim())))
        )
          return toast("Lengkapi semua soal dan pilihan");
        const o = { ...Q, id: Q.id || Store.uid("q") };
        delete o._for;
        if (o.tipe !== "native") o.soal = [];
        up(D.quiz, o);
        Q = null;
        edit = null;
        save();
        draw();
      }
      function getKelasList() {
        if (!D.daftar_kelas || !Array.isArray(D.daftar_kelas) || !D.daftar_kelas.length) {
          D.daftar_kelas = structuredClone(DEFAULT_KELAS);
        }
        return D.daftar_kelas;
      }
      function tambahKelas() {
        const raw = prompt("Masukkan nama kelas baru (contoh: X E atau XII D):");
        if (raw === null) return;
        const kls = raw.trim();
        if (!kls) return toast("Nama kelas tidak boleh kosong");
        const list = getKelasList();
        if (list.some((k) => k.toLowerCase() === kls.toLowerCase())) {
          return toast(`Kelas ${kls} sudah ada!`);
        }
        list.push(kls);
        D.daftar_kelas = list;
        D.kelas_siswa = D.kelas_siswa || {};
        if (!D.kelas_siswa[kls]) D.kelas_siswa[kls] = [];
        save();
        draw();
        toast(`Kelas ${kls} berhasil ditambahkan`);
      }
      function hapusKelas(kls) {
        const siswa = (D.kelas_siswa || {})[kls] || [];
        const msg = siswa.length
          ? `Hapus kelas ${kls} beserta ${siswa.length} siswa di dalamnya?`
          : `Hapus kelas ${kls}?`;
        if (confirm(msg)) {
          D.daftar_kelas = getKelasList().filter((k) => k !== kls);
          if (D.kelas_siswa && D.kelas_siswa[kls]) {
            delete D.kelas_siswa[kls];
          }
          if (curMasterKls === kls) {
            curMasterKls = null;
          }
          save();
          draw();
          toast(`Kelas ${kls} dihapus`);
        }
      }
      let A, filterKelas = "Semua";
      function pAbsen() {
        if (!edit) {
          const allList = D.absen || [];
          const list = allList.filter(
            (x) => filterKelas === "Semua" || x.kelas === filterKelas,
          );
          return `<div class="panel">
            <div class="row" style="justify-content:space-between;margin-bottom:14px;align-items:center">
              <div class="row" style="gap:10px;align-items:center">
                <b>Daftar Sesi Presensi (${list.length})</b>
                <select onchange="filterKelas=this.value;draw()" style="width:auto;padding:5px 10px;font-size:13px">
                  <option value="Semua" ${filterKelas === "Semua" ? "selected" : ""}>Semua Kelas</option>
                  ${getKelasList().map((k) => `<option value="${k}" ${filterKelas === k ? "selected" : ""}>${k}</option>`).join("")}
                </select>
              </div>
              <button class="btn sm" onclick="edit='new';draw()">Buat Sesi Baru</button>
            </div>
            ${list.map((x, idx) => {
              const h = x.siswa.filter((s) => s.status === "Hadir").length;
              const s = x.siswa.filter((s) => s.status === "Sakit").length;
              const i = x.siswa.filter((s) => s.status === "Izin").length;
              const a = x.siswa.filter((s) => s.status === "Alpa").length;
              const b = x.siswa.filter((s) => !s.status).length;
              return `<div class="item">
                <div style="display:flex;align-items:flex-start;gap:12px">
                  <span style="font-size:15px;color:var(--text-muted);font-weight:700;min-width:24px;line-height:1.4">${idx + 1}.</span>
                  <div>
                    <b>${esc(x.kelas)} · ${esc(fmtTanggal(x.tanggal))}</b>
                    <div class="hint">Topik: ${esc(x.topik || "Umum")} · Total: ${x.siswa.length} siswa</div>
                    <div class="row" style="margin-top:6px;gap:6px">
                      <span class="badge h">Hadir: ${h}</span>
                      <span class="badge s">Sakit: ${s}</span>
                      <span class="badge i">Izin: ${i}</span>
                      <span class="badge a">Alpa: ${a}</span>
                      ${b ? `<span class="badge" style="background:var(--border);color:var(--text-muted)">Belum: ${b}</span>` : ""}
                    </div>
                  </div>
                </div>
                <div class="row">
                  <button class="btn sm ghost" onclick="edit='${x.id}';draw()">Buka</button>
                  <button class="btn sm" onclick="expExcel('${x.id}')">Unduh Excel</button>
                  <button class="btn sm del" onclick="del('absen','${x.id}')">Hapus</button>
                </div>
              </div>`;
            }).join("") || '<div class="empty">Belum ada data.</div>'}
          </div>`;
        }

        if (!A || A._for !== edit) {
          const defaultKls = filterKelas !== "Semua" ? filterKelas : "";
          const master = defaultKls ? (D.kelas_siswa || {})[defaultKls] || [] : [];
          A = structuredClone(
            (D.absen || []).find((x) => x.id === edit) || {
              tanggal: new Date().toISOString().slice(0, 10),
              kelas: defaultKls,
              topik: "",
              siswa: master.map((nama) => ({
                nama,
                status: "",
                catatan: "",
              })),
            },
          );
          A._for = edit;
        }

        return `<div class="panel">
          <b>${A.id ? "Ubah" : "Buat Sesi"} Presensi</b>
          <div class="row" style="gap:14px;margin-top:10px">
            <div style="flex:1;min-width:200px">
              <label>Tanggal</label>
              <input type="date" id="a_tgl" value="${esc(A.tanggal)}" onchange="syncA();draw()">
              <div class="hint">${fmtTanggal(A.tanggal)}</div>
            </div>
            <div style="flex:1;min-width:200px">
              <label>Pilih Kelas</label>
              <select id="a_kls" onchange="onAbsenKelasChange(this.value)">
                <option value="" ${!A.kelas ? "selected" : ""}>-- Pilih Kelas --</option>
                ${getKelasList().map((k) => `<option value="${k}" ${A.kelas === k ? "selected" : ""}>${k}</option>`).join("")}
              </select>
            </div>
          </div>
          <label>Materi / Topik Pembelajaran</label>
          <input id="a_topik" value="${esc(A.topik)}" placeholder="Contoh: Gerak Lurus Beraturan (GLB)">

          <div style="margin-top:24px;border-top:1px solid var(--border);padding-top:18px">
            <div style="margin-bottom:12px">
              <b>Daftar Kehadiran Siswa ${A.kelas ? "Kelas " + esc(A.kelas) + " (" + A.siswa.length + " siswa)" : ""}</b>
              <div class="hint">Pilih status kehadiran: H (Hadir), S (Sakit), I (Izin), atau A (Alpa)</div>
            </div>

            <div style="display:flex;flex-direction:column;gap:8px" id="siswa_list">
              ${
                A.siswa.length
                  ? A.siswa
                      .map(
                        (s, idx) => `
                <div class="item" style="padding:10px 12px;gap:12px;background:var(--bg);border-radius:8px;border-bottom:none">
                  <div style="flex:1;min-width:180px;display:flex;align-items:center;gap:10px">
                    <span style="font-size:13px;color:var(--text-muted);font-weight:700;width:24px;text-align:right">${idx + 1}.</span>
                    <span style="font-weight:700;font-size:14px;color:var(--text)">${esc(s.nama)}</span>
                  </div>
                  <div class="status-btn-group" data-idx="${idx}">
                    <button type="button" class="status-btn h ${s.status === 'Hadir' ? 'active' : ''}" onclick="setSiswaStatus(${idx}, 'Hadir')">H</button>
                    <button type="button" class="status-btn s ${s.status === 'Sakit' ? 'active' : ''}" onclick="setSiswaStatus(${idx}, 'Sakit')">S</button>
                    <button type="button" class="status-btn i ${s.status === 'Izin' ? 'active' : ''}" onclick="setSiswaStatus(${idx}, 'Izin')">I</button>
                    <button type="button" class="status-btn a ${s.status === 'Alpa' ? 'active' : ''}" onclick="setSiswaStatus(${idx}, 'Alpa')">A</button>
                  </div>
                  <div style="width:200px">
                    <input data-idx="${idx}" data-field="catatan" value="${esc(s.catatan || '')}" placeholder="Keterangan / Catatan" style="padding:6px 10px;font-size:13px;background:var(--surface)">
                  </div>
                </div>
              `,
                      )
                      .join("")
                  : !A.kelas
                    ? `<div class="empty" style="padding:24px">Silakan pilih kelas terlebih dahulu untuk memuat daftar siswa.</div>`
                    : `<div class="empty" style="padding:24px">Kelas <b>${esc(A.kelas)}</b> belum memiliki data siswa.<br><span class="hint">Silakan masukkan daftar nama siswa di menu <b>👥 Data Siswa</b> terlebih dahulu.</span></div>`
              }
            </div>
          </div>

          <div class="row" style="margin-top:24px;border-top:1px solid var(--border);padding-top:18px">
            <button class="btn" onclick="sA()">Simpan Presensi</button>
            <button class="btn ghost" onclick="edit=null;A=null;draw()">Batal</button>
          </div>
        </div>`;
      }
      function onAbsenKelasChange(val) {
        syncA();
        A.kelas = val;
        if (!val) {
          A.siswa = [];
        } else {
          const master = (D.kelas_siswa || {})[val] || [];
          A.siswa = master.map((nama) => ({
            nama,
            status: "",
            catatan: "",
          }));
        }
        draw();
      }
      function syncA() {
        if (!A) return;
        if ($("#a_tgl")) A.tanggal = $("#a_tgl").value;
        if ($("#a_kls")) A.kelas = $("#a_kls").value;
        if ($("#a_topik")) A.topik = $("#a_topik").value;
        document.querySelectorAll("#siswa_list input[data-field='catatan']").forEach((inp) => {
          const idx = +inp.dataset.idx;
          if (A.siswa[idx]) A.siswa[idx].catatan = inp.value;
        });
      }
      function setSiswaStatus(idx, status) {
        syncA();
        if (A.siswa[idx]) {
          A.siswa[idx].status = A.siswa[idx].status === status ? "" : status;
          draw();
        }
      }
      function sA() {
        syncA();
        if (!A.tanggal) return toast("Tanggal wajib diisi");
        if (!A.kelas.trim()) return toast("Kelas wajib diisi");
        if (!A.siswa.length)
          return toast("Belum ada data siswa di kelas ini. Masukkan di menu Data Siswa.");
        const o = { ...A, id: A.id || Store.uid("a") };
        delete o._for;
        D.absen = D.absen || [];
        up(D.absen, o);
        A = null;
        edit = null;
        save();
        draw();
      }
      function expExcel(id) {
        const s = (D.absen || []).find((x) => x.id === id);
        if (!s) return;
        const h = s.siswa.filter((x) => x.status === "Hadir").length;
        const sk = s.siswa.filter((x) => x.status === "Sakit").length;
        const i = s.siswa.filter((x) => x.status === "Izin").length;
        const a = s.siswa.filter((x) => x.status === "Alpa").length;
        const b = s.siswa.filter((x) => !x.status).length;

        const html = `
          <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
          <head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Presensi</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
          <style>
            table { border-collapse: collapse; font-family: Calibri, sans-serif; }
            th, td { border: 1px solid #b0b0b0; padding: 6px 12px; font-size: 11pt; }
            th { background-color: #0891b2; color: #ffffff; font-weight: bold; text-align: center; }
            .center { text-align: center; }
            .hadir { background-color: #dcfce7; color: #15803d; font-weight: bold; text-align: center; }
            .sakit { background-color: #e0f2fe; color: #0369a1; font-weight: bold; text-align: center; }
            .izin { background-color: #fef3c7; color: #92400e; font-weight: bold; text-align: center; }
            .alpa { background-color: #fee2e2; color: #b91c1c; font-weight: bold; text-align: center; }
            .title { font-size: 14pt; font-weight: bold; color: #083344; }
            .meta { background-color: #f8fafc; font-weight: bold; }
          </style>
          </head>
          <body>
            <table>
              <tr><td colspan="4" class="title">REKAPITULASI PRESENSI - KELAS ${esc(s.kelas)}</td></tr>
              <tr><td class="meta">Tanggal</td><td colspan="3">${esc(fmtTanggal(s.tanggal))}</td></tr>
              <tr><td class="meta">Materi / Topik</td><td colspan="3">${esc(s.topik || "-")}</td></tr>
              <tr><td class="meta">Ringkasan Kehadiran</td><td colspan="3">Total Siswa: ${s.siswa.length} | Hadir: ${h} | Sakit: ${sk} | Izin: ${i} | Alpa: ${a}${b ? " | Belum Dipilih: " + b : ""}</td></tr>
              <tr><td colspan="4"></td></tr>
              <tr>
                <th style="width:50px">No</th>
                <th style="width:260px">Nama Siswa</th>
                <th style="width:140px">Status Kehadiran</th>
                <th style="width:220px">Keterangan / Catatan</th>
              </tr>
              ${s.siswa
                .map((item, idx) => {
                  const stClass =
                    item.status === "Hadir"
                      ? "hadir"
                      : item.status === "Sakit"
                        ? "sakit"
                        : item.status === "Izin"
                          ? "izin"
                          : item.status === "Alpa"
                            ? "alpa"
                            : "center";
                  return `<tr>
                  <td class="center">${idx + 1}</td>
                  <td>${esc(item.nama)}</td>
                  <td class="${stClass}">${esc(item.status || "-")}</td>
                  <td>${esc(item.catatan || "")}</td>
                </tr>`;
                })
                .join("")}
            </table>
          </body>
          </html>
        `;

        const blob = new Blob([html], {
          type: "application/vnd.ms-excel;charset=utf-8",
        });
        const elem = document.createElement("a");
        elem.href = URL.createObjectURL(blob);
        const cleanKls = (s.kelas || "Kelas").replace(/\s+/g, "_");
        elem.download = `Presensi_${cleanKls}_${s.tanggal}.xls`;
        elem.click();
      }
      let curMasterKls = null,
        editMaster = false;
      function pSiswa() {
        D.kelas_siswa = D.kelas_siswa || {};
        const klsList = getKelasList();

        if (!curMasterKls) {
          return `<div class="panel">
            <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px">
              <b>Daftar Kelas (${klsList.length})</b>
              <button class="btn sm" onclick="tambahKelas()">${ICON_PLUS}Tambah Kelas</button>
            </div>
            ${klsList.map((k, idx) => {
              const count = ((D.kelas_siswa || {})[k] || []).length;
              return `<div class="item">
                <div style="display:flex;align-items:center;gap:12px">
                  <span style="font-size:15px;color:var(--text-muted);font-weight:700;min-width:24px">${idx + 1}.</span>
                  <div>
                    <b>Kelas ${esc(k)}</b>
                    <div class="hint">${count ? `${count} siswa terdaftar` : "Belum ada data siswa"}</div>
                  </div>
                </div>
                <div class="row">
                  <button class="btn sm ghost" onclick="curMasterKls='${esc(k)}';editMaster=false;draw()">Buka</button>
                  <button class="btn sm del" onclick="hapusKelas('${esc(k)}')">Hapus</button>
                </div>
              </div>`;
            }).join("") || '<div class="empty">Belum ada kelas. Klik tombol <b>Tambah Kelas</b> untuk menambahkan.</div>'}
          </div>`;
        }

        const list = D.kelas_siswa[curMasterKls] || [];

        if (editMaster) {
          return `<div class="panel">
            <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
              <div class="row" style="gap:10px;align-items:center">
                <button class="btn sm ghost" onclick="editMaster=false;draw()">← Kembali</button>
                <b>Edit Daftar Siswa: Kelas ${esc(curMasterKls)}</b>
              </div>
              <span class="hint">Copy-paste dari Excel atau ketik satu nama per baris</span>
            </div>
            <textarea id="master_text" style="min-height:280px;font-family:inherit;line-height:1.6" placeholder="Budi Santoso&#10;Citra Dewi&#10;Dedi Pratama">${esc(list.join("\n"))}</textarea>
            <div class="row" style="margin-top:14px">
              <button class="btn" onclick="saveMasterSiswa()">Simpan Daftar Siswa</button>
              <button class="btn ghost" onclick="editMaster=false;draw()">Batal</button>
            </div>
          </div>`;
        }

        return `<div class="panel">
          <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:16px">
            <div class="row" style="gap:10px;align-items:center">
              <button class="btn sm ghost" onclick="curMasterKls=null;draw()">← Kembali ke Daftar Kelas</button>
              <b>Kelas ${esc(curMasterKls)}</b>
              <span class="hint">(${list.length} Siswa)</span>
            </div>
            <div class="row">
              <button class="btn sm" onclick="editMaster=true;draw()">Edit</button>
              <button class="btn sm del" onclick="hapusKelas('${esc(curMasterKls)}')">Hapus Kelas</button>
            </div>
          </div>

          <div style="background:var(--bg);border-radius:10px;padding:16px">
            ${
              list.length
                ? `<div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:8px">
                ${list
                  .map(
                    (nama, idx) => `
                  <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px">
                    <span style="font-size:12px;color:var(--text-muted);font-weight:700;width:24px">${idx + 1}.</span>
                    <span style="font-weight:600;font-size:14px">${esc(nama)}</span>
                  </div>
                `,
                  )
                  .join("")}
              </div>`
                : `<div class="empty" style="background:var(--surface);padding:30px">
              Belum ada data siswa untuk kelas <b>${curMasterKls}</b>.<br>
              Klik tombol <b>Edit</b> di atas untuk memasukkan nama-nama siswa sekaligus.
            </div>`
            }
          </div>
        </div>`;
      }
      function saveMasterSiswa() {
        const raw = $("#master_text").value;
        const lines = raw
          .split("\n")
          .map((l) => l.trim())
          .filter(Boolean);
        D.kelas_siswa = D.kelas_siswa || {};
        D.kelas_siswa[curMasterKls] = lines;
        editMaster = false;
        save();
        toast(
          `Data siswa kelas ${curMasterKls} tersimpan (${lines.length} siswa)`,
        );
        draw();
      }
      function pSite() {
        const s = D.site;
        return `<div class="panel"><b>Pengaturan website</b>${[
          ["nama", "Nama website"],
          ["tagline", "Judul besar halaman Home"],
          ["deskripsi", "Deskripsi Home"],
          ["footer", "Teks footer"],
        ]
          .map(
            ([k, l]) =>
              `<label>${l}</label><input id="s_${k}" value="${esc(s[k])}">`,
          )
          .join("")}
 <div class="row" style="margin-top:18px"><button class="btn" onclick="['nama','tagline','deskripsi','footer'].forEach(k=>D.site[k]=$('#s_'+k).value);save()">Simpan</button></div></div>`;
      }
      function pData() {
        return `<div class="panel"><b>Cadangan data</b><p class="sub">Penyimpanan lokal hanya ada di browser ini. Unduh cadangan untuk memindahkan data ke komputer lain.</p>
 <div class="row"><button class="btn" onclick="exp()">Unduh cadangan (.json)</button><label class="btn ghost" style="margin:0;cursor:pointer">Pulihkan dari file<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label><button class="btn del" onclick="if(confirm('Kosongkan semua data? Semua data yang tersimpan akan dihapus.')){Store.reset();D=Store.get();draw()}">Kosongkan data</button></div></div>`;
      }
      function exp() {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(
          new Blob([JSON.stringify(D, null, 1)], { type: "application/json" }),
        );
        a.download = "fisika-data.json";
        a.click();
      }
      function imp(f) {
        if (!f) return;
        f.text().then((t) => {
          try {
            const j = JSON.parse(t);
            if (!j.site || !j.materi || !j.quiz) throw 0;
            j.absen = j.absen || [];
            j.daftar_kelas = j.daftar_kelas || structuredClone(DEFAULT_KELAS);
            j.kelas_siswa = j.kelas_siswa || {};
            D = j;
            save();
            draw();
          } catch (e) {
            toast("File tidak valid");
          }
        });
      }
      draw();
    </script>
  </body>
</html>
